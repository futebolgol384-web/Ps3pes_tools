name: Build PS3 PKG

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      PS3DEV: ${{ github.workspace }}/ps3dev
      PSL1GHT: ${{ github.workspace }}/ps3dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar toolchain PS3 (prebuilt)
        run: |
          set -e
          echo "Baixando toolchain..."
          curl -sL -o ps3dev.tar.gz \
            "https://github.com/bucanero/ps3toolchain/releases/download/ubuntu-latest-fad3b5fb/ps3dev-ubuntu-latest-2020-08-31.tar.gz"
          tar xzf ps3dev.tar.gz
          echo "${{ github.workspace }}/ps3dev/bin" >> $GITHUB_PATH
          echo "${{ github.workspace }}/ps3dev/ppu/bin" >> $GITHUB_PATH
          echo "${{ github.workspace }}/ps3dev/spu/bin" >> $GITHUB_PATH

      - name: Adaptar pkg.py para Python 3
        run: |
          set -e
          PKGPY="$PS3DEV/bin/pkg.py"
          if [ -f "$PKGPY" ]; then
            # Corrige sintaxe Python 2 -> 3
            sed -i 's/except Exception, e:/except Exception as e:/g' "$PKGPY"
            sed -i 's/except Exception,e:/except Exception as e:/g' "$PKGPY"
            sed -i 's/print \(.*\)/print(\1)/g' "$PKGPY" || true
            # Garante shebang python3
            sed -i '1s|.*|#!/usr/bin/env python3|' "$PKGPY"
            head -5 "$PKGPY"
          fi

      - name: Compilar e gerar PKG
        run: |
          set -e
          export PATH="$PS3DEV/bin:$PS3DEV/ppu/bin:$PATH"
          make clean || true
          make pkg
          ls -la *.pkg *.self 2>/dev/null || ls -la

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: ps3-pkg
          path: |
            *.pkg
            *.self
          if-no-files-found: warn
