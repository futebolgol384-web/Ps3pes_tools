name: Build PS3 PKG

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      PS3DEV: ${{ github.workspace }}/ps3dev
      PSL1GHT: ${{ github.workspace }}/ps3dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar toolchain PS3 (prebuilt)
        run: |
          set -e
          curl -sL -o ps3dev.tar.gz \
            "https://github.com/bucanero/ps3toolchain/releases/download/ubuntu-latest-fad3b5fb/ps3dev-ubuntu-latest-2020-08-31.tar.gz"
          tar xzf ps3dev.tar.gz
          echo "${{ github.workspace }}/ps3dev/bin" >> $GITHUB_PATH
          echo "${{ github.workspace }}/ps3dev/ppu/bin" >> $GITHUB_PATH
          echo "${{ github.workspace }}/ps3dev/spu/bin" >> $GITHUB_PATH

      - name: Compilar ELF e SELF
        run: |
          set -e
          export PATH="$PS3DEV/bin:$PS3DEV/ppu/bin:$PATH"
          make clean || true
          make all
          ppu-strip ps3tools.elf
          sprxlinker ps3tools.elf
          make_self ps3tools.elf ps3tools.self
          ls -la ps3tools.elf ps3tools.self
          # Tenta PKG, mas nao falha o build se der erro
          mkdir -p pkg/USRDIR
          cp ps3tools.self pkg/USRDIR/EBOOT.BIN
          python3 $PS3DEV/bin/pkg.py --contentid UP0001-PSTL00001_00-0000000000000000 pkg/ ps3tools.pkg 2>/dev/null || echo "PKG tool antigo falhou (normal no Python 3)"
          ls -la

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ps3-build
          path: |
            ps3tools.self
            ps3tools.elf
            *.pkg
          if-no-files-found: error
