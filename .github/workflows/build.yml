name: Build PS3 PKG

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      PS3DEV: ${{ github.workspace }}/ps3dev
      PSL1GHT: ${{ github.workspace }}/ps3dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Python 2
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y python2 || sudo apt-get install -y python2.7
          python2 --version || python2.7 --version

      - name: Baixar toolchain PS3
        run: |
          set -e
          curl -sL -o ps3dev.tar.gz \
            "https://github.com/bucanero/ps3toolchain/releases/download/ubuntu-latest-fad3b5fb/ps3dev-ubuntu-latest-2020-08-31.tar.gz"
          tar xzf ps3dev.tar.gz
          echo "${{ github.workspace }}/ps3dev/bin" >> $GITHUB_PATH
          echo "${{ github.workspace }}/ps3dev/ppu/bin" >> $GITHUB_PATH
          echo "${{ github.workspace }}/ps3dev/spu/bin" >> $GITHUB_PATH

      - name: Garantir python2 nos scripts pkg/sfo
        run: |
          set -e
          PY2=$(command -v python2 || command -v python2.7)
          for f in pkg.py sfo.py fself.py; do
            if [ -f "$PS3DEV/bin/$f" ]; then
              sed -i "1s|.*|#!$PY2|" "$PS3DEV/bin/$f" || true
            fi
          done
          ls -la "$PS3DEV/bin" | head -30
          which make_self make_self_npdrm sfo pkg 2>/dev/null || true
          ls -la "$PS3DEV/bin"/make_self* "$PS3DEV/bin"/sfo* "$PS3DEV/bin"/pkg* 2>/dev/null || true

      - name: Compilar e gerar PKG
        run: |
          set -e
          export PATH="$PS3DEV/bin:$PS3DEV/ppu/bin:$PATH"
          make clean || true
          make pkg
          echo "==== arquivos gerados ===="
          ls -la *.pkg *.self *.elf 2>/dev/null || ls -la
          ls -la build/ 2>/dev/null || true

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: ps3-pkg
          path: |
            *.pkg
            *.self
          if-no-files-found: error
