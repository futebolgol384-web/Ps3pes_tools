name: Build PS3 PKG

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      PS3DEV: ${{ github.workspace }}/ps3dev
      PSL1GHT: ${{ github.workspace }}/ps3dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Python 2 (pkg.py antigo)
        run: |
          sudo apt-get update
          sudo apt-get install -y python2 || sudo apt-get install -y python2.7 || true
          python2 --version || python2.7 --version || true

      - name: Baixar toolchain PS3 (prebuilt)
        run: |
          set -e
          echo "Baixando toolchain..."
          curl -sL -o ps3dev.tar.gz \
            "https://github.com/bucanero/ps3toolchain/releases/download/ubuntu-latest-fad3b5fb/ps3dev-ubuntu-latest-2020-08-31.tar.gz"
          tar xzf ps3dev.tar.gz
          echo "${{ github.workspace }}/ps3dev/bin" >> $GITHUB_PATH
          echo "${{ github.workspace }}/ps3dev/ppu/bin" >> $GITHUB_PATH
          echo "${{ github.workspace }}/ps3dev/spu/bin" >> $GITHUB_PATH

      - name: Compilar e gerar PKG
        run: |
          set -e
          export PATH="$PS3DEV/bin:$PS3DEV/ppu/bin:$PATH"
          # Forca python2 no shebang do pkg.py se existir
          if [ -f "$PS3DEV/bin/pkg.py" ]; then
            sed -i '1s|.*|#!/usr/bin/env python2|' "$PS3DEV/bin/pkg.py" || true
          fi
          make clean || true
          make pkg
          ls -la *.pkg *.self 2>/dev/null || ls -la

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: ps3-pkg
          path: |
            *.pkg
            *.self
          if-no-files-found: warn
