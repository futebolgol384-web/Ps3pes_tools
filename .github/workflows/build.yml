name: Build PS3 PKG

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      PS3DEV: ${{ github.workspace }}/ps3dev
      PSL1GHT: ${{ github.workspace }}/ps3dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Python 2
        run: |
          set -e
          sudo apt-get update
          # Ubuntu 22.04: tenta python2 / python2.7
          sudo apt-get install -y python2 || sudo apt-get install -y python2.7 || true
          # Fallback: baixar get-pip e binario se precisar
          if ! command -v python2 >/dev/null 2>&1 && ! command -v python2.7 >/dev/null 2>&1; then
            sudo apt-get install -y curl
            curl -sL https://github.com/deadsnakes/python2.7/releases 2>/dev/null || true
            # Ultimo recurso: usar pyenv-style nao; tenta pacote legado
            sudo add-apt-repository -y universe || true
            sudo apt-get update
            sudo apt-get install -y python2.7-minimal || true
          fi
          python2 --version || python2.7 --version

      - name: Baixar toolchain PS3
        run: |
          set -e
          curl -sL -o ps3dev.tar.gz \
            "https://github.com/bucanero/ps3toolchain/releases/download/ubuntu-latest-fad3b5fb/ps3dev-ubuntu-latest-2020-08-31.tar.gz"
          tar xzf ps3dev.tar.gz
          echo "${{ github.workspace }}/ps3dev/bin" >> $GITHUB_PATH
          echo "${{ github.workspace }}/ps3dev/ppu/bin" >> $GITHUB_PATH
          echo "${{ github.workspace }}/ps3dev/spu/bin" >> $GITHUB_PATH

      - name: Compilar e gerar PKG
        run: |
          set -e
          export PATH="$PS3DEV/bin:$PS3DEV/ppu/bin:$PATH"
          PY2=$(command -v python2 || command -v python2.7)
          echo "Usando: $PY2"

          make clean || true
          make all

          ppu-strip ps3tools.elf
          sprxlinker ps3tools.elf
          make_self ps3tools.elf ps3tools.self

          # Monta pasta do pacote
          rm -rf pkg
          mkdir -p pkg/USRDIR
          cp ps3tools.self pkg/USRDIR/EBOOT.BIN

          # PARAM.SFO (se sfo.py existir)
          if [ -f "$PS3DEV/bin/sfo.py" ]; then
            $PY2 "$PS3DEV/bin/sfo.py" --title "PS3 FPS Tools" --appid "PSTL00001" pkg/PARAM.SFO || true
          fi

          # Gera PKG com Python 2
          CONTENTID="UP0001-PSTL00001_00-0000000000000000"
          $PY2 "$PS3DEV/bin/pkg.py" --contentid "$CONTENTID" pkg/ ps3tools.pkg

          ls -la ps3tools.pkg ps3tools.self ps3tools.elf
          file ps3tools.pkg || true

      - name: Upload PKG
        uses: actions/upload-artifact@v4
        with:
          name: ps3-pkg
          path: |
            ps3tools.pkg
            ps3tools.self
          if-no-files-found: error
